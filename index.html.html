<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KSMCreate</title>
<style>
:root{--bg:#000;--fg:#fff;--mute:#9a9a9a;--card:#111;--line:#2a2a2a;--r:28px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:rgba(0,0,0,.8);backdrop-filter:blur(10px)}
.logo{width:48px;height:48px;border-radius:14px;cursor:pointer;display:block}
.burger{width:52px;height:52px;border-radius:50%;border:2px solid var(--fg);background:var(--bg);display:grid;place-content:center;gap:6px;cursor:pointer;padding:0}
.burger i{display:block;width:22px;height:2px;background:var(--fg);border-radius:2px;transition:.3s}
.burger.on i:nth-child(1){transform:translateY(8px) rotate(45deg)}
.burger.on i:nth-child(2){opacity:0}
.burger.on i:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
nav{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.96);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:.35s}
nav.on{opacity:1;pointer-events:auto}
nav a{color:var(--fg);text-decoration:none;font-size:22px;letter-spacing:.2em;padding:12px 40px;border:1.5px solid var(--line);border-radius:999px;min-width:260px;text-align:center;cursor:pointer}
nav a:hover,nav a.cur{background:var(--fg);color:var(--bg)}
main{flex:1;width:100%;max-width:960px;margin:0 auto;padding:20px 20px 60px}
.page{display:none;animation:in .5s ease}.page.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hero{min-height:68vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:28px}
.hero img{width:140px;height:140px;border-radius:36px}
.hero h1{font-size:clamp(30px,7vw,60px);font-weight:300;letter-spacing:.04em;margin:0}
.hero p{color:var(--mute);letter-spacing:.3em;margin:0;font-size:13px}
h2{font-weight:300;letter-spacing:.25em;font-size:26px;margin:20px 0 28px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:14px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{width:30%;color:var(--mute);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;position:relative;transition:.25s}
.card:hover{transform:translateY(-4px);border-color:#555}
.card .im{aspect-ratio:4/3;background:#1b1b1b;display:grid;place-items:center}
.card .im img{width:100%;height:100%;object-fit:cover}
.card .im img.lg{width:64px;height:64px;border-radius:16px;opacity:.5;object-fit:contain}
.card .tx{padding:16px 18px 20px}
.card h3{margin:4px 0 8px;font-size:17px;font-weight:500}
.dt{color:var(--mute);font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;border:1px solid #444;border-radius:999px;padding:1px 10px;color:#ddd;background:none;font-family:inherit;cursor:pointer}
.tag.on{background:var(--fg);color:var(--bg)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.btn{background:var(--fg);color:var(--bg);border:0;border-radius:999px;padding:12px 28px;font-size:15px;cursor:pointer;font-family:inherit}
.btn.ghost{background:none;color:var(--fg);border:1px solid #555}
.del{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);cursor:pointer;font-size:18px;line-height:1}
input,textarea{width:100%;background:#000;color:var(--fg);border:1px solid #444;border-radius:16px;padding:12px 16px;font-size:16px;font-family:inherit;margin:6px 0 14px}
label{font-size:13px;color:var(--mute)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:12px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r);max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:26px;position:relative}
.sheet img.pic{width:100%;border-radius:18px;margin:8px 0}
.sheet .x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:1px solid #555;background:none;color:var(--fg);cursor:pointer}
.body{white-space:pre-wrap}
footer{border-top:1px solid var(--line);padding:26px 20px 18px;color:var(--mute);font-size:13px}
.fi{max-width:960px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.lg-btn{background:none;border:0;color:#555;font-size:11px;cursor:pointer;font-family:inherit}
#load{position:fixed;inset:0;z-index:60;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.25s}
#load.on{opacity:1;pointer-events:auto}
#load i{width:44px;height:44px;border-radius:50%;border:3px solid #333;border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{color:var(--mute);text-align:center;padding:40px 0}
</style></head>

 c.querySelector("#adm").setAttribute("style","display:none");
 c.querySelectorAll(".on").forEach(function(e){e.classList.remove("on")});
 c.querySelector("#lg").textContent="login";
 c.querySelector("#data").textContent=JSON.stringify(posts).replace(/</g,"\\u003c");
 var html="<!DOCTYPE html>\n"+c.outerHTML;
 if(!window.claude||!claude.use){alert("クラウド保存が利用できません。claude.ai上のページから操作してください");return}
 claude.use("artifact").then(function(a){
  if(!a){alert("クラウド保存が利用できません。ページ所有者のアカウントでclaude.aiから開いてください");return}
  return a.publish(html)
 }).catch(function(e){if(!e||e.code!=="conflict")alert("クラウド保存に失敗しました。ページ所有者のアカウントで操作してください")});
}
function h(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var nav=$("nav"),bg=$("bg");
bg.onclick=function(){nav.classList.toggle("on");bg.classList.toggle("on")};
nav.querySelectorAll("a").forEach(function(a){a.onclick=function(){go(a.dataset.p)}});
function go(p){
 nav.classList.remove("on");bg.classList.remove("on");
 var l=$("load");l.classList.add("on");
 setTimeout(function(){
  document.querySelectorAll(".page").forEach(function(s){s.classList.toggle("on",s.id==="p-"+p)});
  nav.querySelectorAll("a").forEach(function(a){a.classList.toggle("cur",a.dataset.p===p)});
  if(p==="news")render();window.scrollTo(0,0);
  setTimeout(function(){l.classList.remove("on")},250);
 },350);
}
function openM(n){var s=$("sh");s.innerHTML="";var x=h("button","x","✕");x.onclick=closeM;s.appendChild(x);s.appendChild(n);$("md").classList.add("on")}
function closeM(){$("md").classList.remove("on")}
$("md").onclick=function(e){if(e.target===this)closeM()};
function fmt(t){var d=new Date(t);return d.getFullYear()+"."+("0"+(d.getMonth()+1)).slice(-2)+"."+("0"+d.getDate()).slice(-2)}
function render(){
 var all={};posts.forEach(function(p){(p.tags||[]).forEach(function(t){all[t]=1})});
 var f=$("flt");f.innerHTML="";
 if(Object.keys(all).length){
  var a=h("button","tag"+(filter?"":" on"),"ALL");a.onclick=function(){filter=null;render()};f.appendChild(a);
  Object.keys(all).forEach(function(t){var b=h("button","tag"+(filter===t?" on":""),"#"+t);b.onclick=function(){filter=t;render()};f.appendChild(b)});
 }
 var L=$("list");L.innerHTML="";
 var v=posts.filter(function(p){return !filter||(p.tags||[]).indexOf(filter)>-1});
 if(!v.length){L.appendChild(h("div","empty","まだ投稿はありません"));L.style.display="block"}else L.style.display="grid";
 v.forEach(function(p){
  var c=h("div","card"),im=h("div","im");
  if(p.imgs&&p.imgs[0]){var i=document.createElement("img");i.src=p.imgs[0];im.appendChild(i)}
  else{var g=document.createElement("img");g.src=LOGO;g.className="lg";im.appendChild(g)}
  var tx=h("div","tx");tx.appendChild(h("div","dt",fmt(p.date)));tx.appendChild(h("h3","",p.title));
  var tg=h("div","tags");(p.tags||[]).forEach(function(t){tg.appendChild(h("span","tag","#"+t))});tx.appendChild(tg);
  c.appendChild(im);c.appendChild(tx);
  c.onclick=function(){var w=document.createElement("div");w.appendChild(h("div","dt",fmt(p.date)));w.appendChild(h("h3","",p.title));
   (p.imgs||[]).forEach(function(s){var i=document.createElement("img");i.src=s;i.className="pic";w.appendChild(i)});
   w.appendChild(h("div","body",p.body));openM(w)};
  if(admin){var d=h("button","del","×");d.onclick=function(e){e.stopPropagation();if(confirm("この投稿を削除しますか？")){posts=posts.filter(function(q){return q!==p});save();render()}};c.appendChild(d)}
  L.appendChild(c);
 });
 buildAdm();
}
function shrink(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var m=800,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.7))};im.src=r.result};r.readAsDataURL(file)}
function buildAdm(){
 var a=$("adm");a.style.display=admin?"block":"none";if(!admin)return;a.innerHTML="";a.style.marginBottom="20px";
 a.appendChild(h("label","","新規投稿（お知らせ・イベント）"));
 var t=document.createElement("input");t.placeholder="タイトル";a.appendChild(t);
 var b=document.createElement("textarea");b.rows=5;b.placeholder="本文";a.appendChild(b);
 var tgw=h("div","tags");tgw.style.marginBottom="8px";a.appendChild(tgw);
 var ti=document.createElement("input");ti.placeholder="タグを入力して Enter / 追加";a.appendChild(ti);
 function drawT(){tgw.innerHTML="";tags.forEach(function(x,i){var s=h("button","tag on","#"+x+" ×");s.onclick=function(){tags.splice(i,1);drawT()};tgw.appendChild(s)})}
 function addT(){var v=ti.value.trim().replace(/^#/,"");if(v&&tags.indexOf(v)<0)tags.push(v);ti.value="";drawT()}
 ti.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();addT()}};
 var ab=h("button","btn ghost","タグ追加");ab.onclick=addT;ab.style.marginBottom="14px";a.appendChild(ab);a.appendChild(document.createElement("br"));
 var fi=document.createElement("input");fi.type="file";fi.accept="image/*";fi.multiple=true;a.appendChild(fi);
 var th=h("div","thumbs");a.appendChild(th);
 fi.onchange=function(){Array.prototype.forEach.call(fi.files,function(f){shrink(f,function(s){pics.push(s);var i=document.createElement("img");i.src=s;th.appendChild(i)})})};
 var pb=h("button","btn","投稿する");pb.onclick=function(){
  addT();if(!t.value.trim()){alert("タイトルを入力してください");return}
  posts.unshift({id:Date.now(),date:Date.now(),title:t.value.trim(),body:b.value,tags:tags.slice(),imgs:pics.slice()});
  tags=[];pics=[];save();render()};
 a.appendChild(pb);
}
function setLg(){$("lg").textContent=admin?"logout":"login"}
function owner(){return (window.claude&&claude.use)?claude.use("user").then(function(u){return !!(u&&u.isOwner())}).catch(function(){return false}):Promise.resolve(false)}
$("lg").onclick=function(){
 if(admin){admin=false;try{sessionStorage.removeItem("ksm_a")}catch(e){}setLg();render();
try{if(sessionStorage.getItem("ksm_a")==="1")owner().then(function(ok){if(ok){admin=true;setLg();render()}})}catch(e){}return}
 var w=document.createElement("div");w.appendChild(h("h3","","MANUS LOGIN"));
 w.appendChild(h("p","dt","Manusアカウントにサインインしてください。サインイン画面を閉じると、自動的にお知らせ投稿ページへ移動します。"));
 var a=h("button","btn","Manusにサインイン");a.onclick=function(){
  var pop=window.open("https://manus.im/login","manusLogin","popup,width=480,height=720");
  if(!pop){m.textContent="ポップアップがブロックされています。ブラウザでポップアップを許可してください。";return}
  m.textContent="Manusでのサインイン完了を待機中…";
  var started=Date.now();
  var timer=setInterval(function(){
   if(pop.closed){
    clearInterval(timer);admin=true;
    try{sessionStorage.setItem("ksm_a","1")}catch(e){}
    closeM();setLg();render();go("news");
   }else if(Date.now()-started>15*60*1000){
    clearInterval(timer);m.textContent="サインインの待機時間が終了しました。もう一度お試しください。";
   }
  },500);
 };w.appendChild(a);
 var m=h("p","dt","");w.appendChild(m);openM(w);
};
$("cs").onclick=function(){
 var n=$("cn").value.trim(),e=$("ce").value.trim(),m=$("cm").value.trim(),r=$("cr");
 if(!n||!e||!m){r.textContent="すべての項目を入力してください";return}
 if(!$("ca").checked){r.textContent="プライバシーポリシーへの同意が必要です";return}
 if(!MAIL){r.textContent="現在、送信先メールアドレスを準備中です。しばらくお待ちください。";return}
 location.href="mailto:"+MAIL+"?subject="+encodeURIComponent("【KSMCreate】お問い合わせ")+"&body="+encodeURIComponent(n+" ("+e+")\n\n"+m);
};
setLg();render();
document.querySelectorAll(".page")[0].classList.add("on");
</script>
